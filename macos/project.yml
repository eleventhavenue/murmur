name: Murmur
options:
  bundleIdPrefix: ai.murmur
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGNING_ALLOWED: "NO"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Murmur:
    type: application
    platform: macOS
    sources:
      - path: Murmur/Sources
      - path: Murmur/Resources
        excludes: ["Info.plist", "Fonts"]
      - path: Murmur/Resources/Fonts
        type: folder
    info:
      path: Murmur/Resources/Info.plist
      properties:
        CFBundleName: Murmur
        CFBundleDisplayName: Murmur
        CFBundleIdentifier: ai.murmur.app
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "© 2026 Murmur"
        CFBundleIconFile: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: ai.murmur.app
            CFBundleURLSchemes: [murmur]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.murmur.app
        ENABLE_HARDENED_RUNTIME: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Murmur/Resources/Info.plist
